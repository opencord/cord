# testkube Scenario
# brings up minikube for basic testing

# create a cord_values dir next to the cord checkout
config_cord_values_dir: "{{ ( playbook_dir ~ '/../../../cord_values' ) | realpath }}"

# testkube scenario configuration
use_minikube: true

# apache proxied ports are different when using k8s
portnumber_xos_ws: 30008
portnumber_xos_gui: 30001
portnumber_chameleon: 30006

# make targets
build_targets:
  - helm-up-xos-core

deploy_tiller_prereqs:
  - deploy-minikube

cord_helm_images_prereqs:
  - local-docker-images

helm_up_prereqs:
  - deploy-minikube
  - cord-helm-images

# images for imagebuilder to build/pull (tagged elsewhere)
docker_image_whitelist:
  - "xosproject/xos-base"
  - "xosproject/xos-core"
  - "xosproject/xos-client"
  - "xosproject/xos-gui"
  - "xosproject/xos-gui-builder"
  - "xosproject/xos-libraries"
  - "xosproject/xos-tosca"
  - "xosproject/xos-ws"
  - "xosproject/chameleon"
  - "xosproject/xos-synchronizer-base"
  - "nginx"
  - "node"
  - "postgres"
  - "redis"

# Ansible Inventory
inventory_groups:

  config:
    localhost:
      ansible_connection: local

  build:
    localhost:
      ansible_connection: local

  head:
    localhost:
      ansible_connection: local

  compute:

