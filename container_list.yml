---
# CORD container list

branch: opencord/master

docker_build_tag: "candidate"

#
# Docs for repo_docker_images
#
# required:
#  name: Name of docker image
#  repo: git repo name (not the path! not what it's renamed!)
# optional:
#  dockerfile: name of Dockerfile. Default: "Dockerfile"
#  path: path to directory containing dockerfile. Default: "."
#  context: build context path, relative to path. Default: "."
#

repo_docker_images:
  - name: xosproject/xos-base
    repo: xos
    path: "containers/xos"
    dockerfile: "Dockerfile.base"
  - name: xosproject/xos
    repo: xos
    path: "containers/xos"
    dockerfile: "Dockerfile.devel"
    context: "../.."
  - name: xosproject/chameleon
    repo: xos
    path: "containers/chameleon"
    dockerfile: "Dockerfile.chameleon"
  - name: xosproject/xos-client
    repo: xos
    path: "containers/xos"
    dockerfile: "Dockerfile.client"
    context: "../.."
  - name: xosproject/xos-synchronizer-base
    repo: xos
    path: "containers/xos"
    dockerfile: "Dockerfile.synchronizer-base"
  - name: xosproject/xos-rest-gw
    repo: xos-rest-gw
  - name: xosproject/xos-gui
    repo: xos-gui
  - name: xosproject/xos-gui-extension-builder
    repo: xos-gui
    dockerfile: "Dockerfile.xos-gui-extension-builder"

