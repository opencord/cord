---
# opencloud-in-a-box-playbook.yml
# configures host for running the OpenCloud-in-a-Box 

- name: Include vars
  hosts: localhost
  tasks:
    - name: Include vars
      include_vars: "../config/opencloud_in_a_box.yml"

- name: Configure libvirt networks
  hosts: localhost
  roles:
    - virt-nets

