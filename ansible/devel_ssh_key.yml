- hosts: localhost
  connection: local
  vars:
    - ssh_keysize: 4096
    - ssh_keytype: rsa

  tasks:
    - name: Create devel ssh key
      user:
        name: "{{ ansible_user }}"
        generate_ssh_key: yes
        ssh_key_comment: cord-devel-key
        ssh_key_type: "{{ ssh_keytype }}"
        ssh_key_bits: "{{ ssh_keysize }}"

- hosts: head
  vars:
   - ssh_keytype: rsa

  tasks:
    - name: Add devel ssh key to head node user
      authorized_key:
        user: "{{ ansible_user }}"
        key: "{{lookup('file', '~/.ssh/id_' ~ ssh_keytype ~ '.pub')}}"

