---

- name: Ensure sym links in /opt
  become: yes
  file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  with_items:
  - { src: '/opt/cord', dest: '{{ ansible_env.HOME }}/cord' }
  - { src: '/opt/cord_profile', dest: '{{ ansible_env.HOME }}/cord_profile' }

- name: Ensure SSH keypair
  shell: ssh-keygen -b 2048 -t rsa -f {{ ansible_env.HOME }}/.ssh/id_rsa -q -N ""
  args:
    creates: "{{ ansible_env.HOME }}/.ssh/id_rsa"

- name: Ensure public key in authorized_keys
  authorized_key:
    user: "{{ ansible_user_id }}"
    state: present
    key: "{{ lookup('file', lookup('env', 'HOME') + /.ssh/id_rsa.pub') }}"


- name: Ensure insecure registry in DOCKER_OPTS (will go away!)
  become: yes
  lineinfile:
    path: /etc/default/docker
    line: 'DOCKER_OPTS="--insecure-registry 10.100.198.201:5000 --insecure-registry docker-registry:5000"'

- name: Restart Docker daemon (will go away!)
  become: yes
  service:
    name: docker
    state: restarted
