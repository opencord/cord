- name: Set disk label
  command: parted {{ extra_disk_dev }} mklabel msdos

- name: Create primary partition
  command: parted {{ extra_disk_dev }} mkpart primary 1 100%

- name: Make filesystem
  command: mkfs.ext4 {{ extra_disk_part }}

- name: Add disk device to /etc/fstab
  lineinfile:
    path: /etc/fstab
    line: "{{ extra_disk_part }} /mnt ext4 rw 0 0"

- name: Mount extra disk
  command: mount /mnt

- name: Set up links
  file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    type: link
  with_items: "{{ extra_disk_links }}"
