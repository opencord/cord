- name: Set disk label
  command: parted {{ extra_disk_dev }} mklabel msdos

- name: Create primary partition
  command: parted {{ extra_disk_dev }} mkpart primary 1 100%

- name: Make filesystem
  filesystem:
    fstype: ext4
    dev: "{{ extra_disk_part }}"

- name: Mount extra disk
  mount:
    name: /mnt
    src: "{{ extra_disk_part }}"
    fstype: ext4
    state: present

- name: Set up links
  file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    type: link
  with_items: "{{ extra_disk_links }}"
