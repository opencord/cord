- name: Ensure SSH config file exists
  file:
    path: "{{ default_ssh_config_file }}"
    state: touch
    mode: 0600

- name: Add SSH config block to config file
  blockinfile:
    path: "{{ default_ssh_config_file }}"
    state: present
    block: "{{ lookup('file', vagrant_ssh_config_file ) }}"
