- name: Apt Repo
  apt_repository:
    repo: ppa:git-core/ppa
    state: present
    update_cache: yes

- name: Apt packages
  apt:
    name: "{{ item }}"
  with_items: "{{ apt_packages }}"
  tags: [buildtools]

- name: Ensure Repo
  get_url:
    url: https://storage.googleapis.com/git-repo-downloads/repo
    dest: /usr/local/bin/repo
    owner: root
    group: root
    mode: 0755

