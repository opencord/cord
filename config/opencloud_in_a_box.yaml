---
# Opencloud-in-a-Box configuration

public_network: pubnet
mgmt_network: ocmgmt

virt_nets:
  - name: pubnet
    ipv4_prefix: 10.230.100
    nodes:
      - name: head1
        ipv4_last_octet: 100
      - name: compute1
        ipv4_last_octet: 101
      - name: compute2
        ipv4_last_octet: 102
  - name: ocmgmt
    ipv4_prefix: 192.168.200
    nodes:
      - name: head1
        ipv4_last_octet: 1
      - name: compute1
        ipv4_last_octet: 201
      - name: compute2
        ipv4_last_octet: 202

