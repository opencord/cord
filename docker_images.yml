# docker_images.yml
# master list of docker images used by scripts/imagebuilder.py

# Tag to set on every container that is built/downloaded

docker_build_tag: "candidate"


# pull_only_images - images pulled and used directly without changes
#
# you must include a tag (':1.0') on these images to pull the correct version
#
# do not include images in this list that are parents of images in
# `buildable_images` - those are automatically pulled

pull_only_images:

  - "gliderlabs/consul-server:0.6"
  - "gliderlabs/registrator:v7"
  - "nginx:1.13"
  - "onosproject/onos:1.10.10"
  - "redis:3.2"
  - "node:7.9.0" # remove once the issue with node:candidate is resolved
  - "sebp/elk:564"


# buildable_images - list of images that we build from Dockerfiles
#
# required:
#   name: Name of docker image
#   repo: git repo name (not the path! not what it's renamed to be in the repo manifest!)
#
# optional:
#   dockerfile: Name of Dockerfile. Default: "Dockerfile"
#   path: Path to parent directory of containing dockerfile, relative to. Default: "."
#   context: Path to docker build context, relative to path item. Default: "."
#   component: dict of sub-component paths to copy into build context.
#     repo: Name of component repo to copy from (required)
#     path: path in to copy from. Relative to component repo. Default "."
#     dest: destination path to copy components to, relative to context

buildable_images:

  - name: opencord/mavenrepo
    repo: cord-onos-publisher
    dockerfile: "Dockerfile.make"

  - name: xosproject/xos-base
    repo: xos
    path: "containers/xos"
    dockerfile: "Dockerfile.base"

  - name: xosproject/xos-postgres
    repo: xos
    path: "containers/postgresql"

  - name: xosproject/xos
    repo: xos
    path: "containers/xos"
    dockerfile: "Dockerfile.xos"
    context: "../.."

  - name: xosproject/xos-libraries
    repo: xos
    path: "containers/xos"
    dockerfile: "Dockerfile.libraries"
    context: "../.."

  - name: xosproject/xos-corebuilder
    repo: xos
    path: "containers/xos"
    dockerfile: "Dockerfile.corebuilder"
    context: "../.."

  - name: xosproject/chameleon
    repo: xos
    path: "containers/chameleon"
    dockerfile: "Dockerfile.chameleon"
    components:
      - repo: chameleon
        dest: tmp.chameleon

  - name: xosproject/xos-client
    repo: xos
    path: "containers/xos"
    dockerfile: "Dockerfile.client"
    context: "../.."
    components:
      - repo: chameleon
        dest: containers/xos/tmp.chameleon

  - name: xosproject/xos-synchronizer-base
    repo: xos
    path: "containers/xos"
    dockerfile: "Dockerfile.synchronizer-base"
    context: "../.."

  - name: xosproject/xos-tosca
    repo: xos-tosca

  - name: xosproject/xos-ws
    repo: xos-rest-gw

  - name: xosproject/xos-gui-builder
    repo: xos-gui
    dockerfile: "Dockerfile.xos-gui-builder"

  - name: xosproject/xos-gui
    repo: xos-gui

  - name: xosproject/gui-extension-sample
    repo: xos-sample-gui-extension

# synchronizer/gui-extension containers that don't match the
# `directory_named_images` pattern

  - name: xosproject/gui-extension-veestat
    repo: vEE
    path: "xos/veestat"

  - name: xosproject/vee-synchronizer
    repo: vEE
    path: "xos/synchronizer"
    dockerfile: "Dockerfile.synchronizer"

  - name: xosproject/onos-synchronizer
    repo: onos-service
    path: "xos/synchronizer"
    dockerfile: "Dockerfile.synchronizer"

  - name: xosproject/veg-synchronizer
    repo: vEG
    path: "xos/synchronizer"
    dockerfile: "Dockerfile.synchronizer"

  - name: xosproject/volt-synchronizer
    repo: olt-service
    path: "xos/synchronizer"
    dockerfile: "Dockerfile.synchronizer"

  - name: xosproject/vtn-synchronizer
    repo: vtn-service
    path: "xos/synchronizer"
    dockerfile: "Dockerfile.synchronizer"

  - name: xosproject/vmme-synchronizer
    repo: vMME
    path: "xos/synchronizer"
    dockerfile: "Dockerfile.synchronizer"

  - name: xosproject/vhss-synchronizer
    repo: vHSS
    path: "xos/synchronizer"
    dockerfile: "Dockerfile.synchronizer"

  - name: xosproject/vepc-synchronizer
    repo: epc-service
    path: "xos/synchronizer"
    dockerfile: "Dockerfile.synchronizer"

# directory_named_images - images named with using a pattern that includes the
# name of the directory they are contained in.
#
# This allows users to drop a directory containing a Dockerfile in the location
# specified, and imagebuilder will be able to build it. If the directory is
# listed in the repo it will be handled as if listed in `buildable_images`, but
# if not, it will be re-built every time.
#
# Most fields are identical to those seen on `buildable_images` with these
# additions:
#
# required:
#   base_path: Path relative to repo_root directory containing directories
#              whose names are used as a part of the container name. Only
#              directories that where the value of `dockerfile` is at `path`
#              are included.
# optional:
#   name_template: This is a string containing `#dirname#`, which is replaced
#                  with the directory name. Default is `#dirname#`

directory_named_images:

  - name_template: "xosproject/#dirname#-synchronizer"
    base_path: orchestration/xos_services
    path: xos/synchronizer
    dockerfile: Dockerfile.synchronizer

  - name_template: "xosproject/gui-extension-#dirname#"
    base_path: orchestration/xos_services
    path: xos/gui

